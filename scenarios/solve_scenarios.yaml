  # Value stacking
  - name: DAM_plus_PV
    energy_tax: 0.12286
    generators:
      DAM_Generator: true
      negative_DAM_Generator: true
      PV_Generator: true
      IMBALANCE_Generator: false
      negative_IMBALANCE_Generator: false
    HouseholdLoad: demand
    marginal_cost_Household_to_SS: -0.12286

  - name: DAM_only_demand_serving
    energy_tax: 0.12286
    generators:
      DAM_Generator: true
      negative_DAM_Generator: true
      PV_Generator: false
      IMBALANCE_Generator: false
      negative_IMBALANCE_Generator: false
    HouseholdLoad: demand
    marginal_cost_Household_to_SS: 0

   # Value stacking with time constraints
  - name: DAM_plus_PV_time_constraints
    energy_tax: 0.12286
    enforce_time_windows: true
    generators:
      DAM_Generator: true
      negative_DAM_Generator: true
      PV_Generator: true
      IMBALANCE_Generator: false
      negative_IMBALANCE_Generator: false
    HouseholdLoad: demand
    marginal_cost_Household_to_SS: -0.12286
  - name: DAM_only_demand_serving_time_constraints  
    energy_tax: 0.12286
    enforce_time_windows: true
    generators:
      DAM_Generator: true
      negative_DAM_Generator: true
      PV_Generator: false
      IMBALANCE_Generator: false
      negative_IMBALANCE_Generator: false
    HouseholdLoad: demand
    marginal_cost_Household_to_SS: 0

  # Value stacking withouth net metering
  - name: DAM_plus_PV_no_net_metering
    energy_tax: 0.12286
    generators:
      DAM_Generator: true
      negative_DAM_Generator: true
      PV_Generator: true
      IMBALANCE_Generator: false
      negative_IMBALANCE_Generator: false
    HouseholdLoad: demand
    marginal_cost_Household_to_SS: 0

