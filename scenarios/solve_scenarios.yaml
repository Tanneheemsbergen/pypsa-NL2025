scenarios:
  # # Trading
  - name: Imbalance_only + Rolling Horizon
    energy_tax: 0.12286
    generators:
      DAM_Generator: false
      negative_DAM_Generator: false
      PV_Generator: false
      IMBALANCE_Generator: true
      negative_IMBALANCE_Generator: true
    HouseholdLoad: 0
    marginal_cost_Household_to_SS: 0

  - name: DAM_only + Rolling Horizon
    energy_tax: 0.12286
    generators:
      DAM_Generator: true
      negative_DAM_Generator: true
      PV_Generator: false
      IMBALANCE_Generator: false
      negative_IMBALANCE_Generator: false
    HouseholdLoad: 0
    marginal_cost_Household_to_SS: 0

  # # Trading with time constraints

